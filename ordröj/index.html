
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>Ordröj</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>ORDRÖJ</h1>
        <p>Gissa ordet på sex försök!</p>
    </header>

    <main>
        <section id="game">

            <div id="length-selector">
                <label for="word-length">
                    Antal bokstäver
                </label>

                <select id="word-length">
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5" selected>5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
            </div>

            <div id="game-board" aria-label="Spelplan">
                <!-- Game tiles generated by JavaScript -->
            </div>

            <p id="message" role="status" aria-live="polite"></p>

            <button id="restart-button" hidden>
                Spela igen
            </button>

            <div id="keyboard">
                <!-- Keyboard generated by JavaScript -->
            </div>

        </section>
    </main>
</body>
</html>
