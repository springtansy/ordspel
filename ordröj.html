
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>Ordröj</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>ORDRÖJ</h1>
        <p>Gissa ordet på sex försök!</p>
    </header>

    <main>
        <section id="game">

            <div id="length-selector">
                <label for="word-length">Antal bokstäver</label>

                <select id="word-length">
                    <option value="3">3 bokstäver</option>
                    <option value="4">4 bokstäver</option>
                    <option value="5" selected>5 bokstäver</option>
                    <option value="6">6 bokstäver</option>
                    <option value="7">7 bokstäver</option>
                    <option value="8">8 bokstäver</option>
                </select>
            </div>

            <div id="game-board" aria-label="Spelplan">
                <!-- Generated by JavaScript -->
            </div>

            <p id="message" role="status" aria-live="polite"></p>

            <div id="keyboard">
                <!-- Generated by JavaScript -->
            </div>

        </section>
    </main>

    <footer>
        <details>
            <summary>Om Ordröj & licenser</summary>

            <p>
                Ordröj is an independently developed word game.
            </p>

            <p>
                The word list is provided by an external
                open-source project under the MIT License.
            </p>

            <p>
                See the ordlista folder for the original
                README and LICENSE.
            </p>
        </details>
    </footer>

</body>
</html>
